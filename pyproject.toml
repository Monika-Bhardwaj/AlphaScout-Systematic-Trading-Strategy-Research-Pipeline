[project]
name = "alphascout"
version = "0.1.0"
description = "Strategy-research pipeline with look-ahead and backtest-overfitting controls as first-class concerns"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "polars>=1.0", "scipy>=1.11", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
